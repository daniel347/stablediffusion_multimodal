# @package _global_

seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "MM_CelebA_Autoencoder"
print_freq: 50
outputdir: /rds/general/user/ds3119/ephemeral/outputs
name: "celeba_rgb_train"
notes: "We train an autoencoder on CelebA images, using RGB only, to attain the lowest possible FID"

function:
  name: training_loop
  params: {}

dataset_name: mm_celeba

training:
  start_iter: 0
  test_every_iter: 400
  compute_metrics: True

  discriminator:
    discriminator_lr: 4e-4

model_initialisation: # "../outputs/MM_CelebA_Autoencoder/checkpoints/2025_03_21__23_27_35_new_obj_z_dist_mmd/model_10.rar"
init_from_stable_diffusion: False

data:
  modality: ["colour"]

defaults:
  - data: mm_celeba
  - ema: power_ema
  - model: v2-inference-rgb-orig
  - training: autoencoder_training_default
  - override training/objective: single_mode_objective
  - override training/discriminator: rgb_discriminator
  - _self_
