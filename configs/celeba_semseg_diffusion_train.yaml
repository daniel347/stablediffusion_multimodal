seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "MM_CelebA_Stable_Diffusion"
print_freq: 50
outputdir: /rds/general/user/ds3119/ephemeral/outputs
name: "new_hyp_ema_opt"
notes: "We optimise EMA for the newest CelebA diffusion model"

function:
  name: test_optimum_EMA  # training_loop  # test_epoch
  kwargs: {out_nimgs: [459648], out_stds: [0.075, 0.1, 0.125, 0.15, 0.175, 0.2, 0.225]}

dataset_name: mm_celeba

training:
  use_mixed_precision: False

  lr: 5e-4
  num_epochs: 20
  start_iter: 0
  patience: 10

  precompute_latents: True
  force_recompute: False
  precompute_latents_path: ../../datasets/latents_precompute
  compute_latent_scale: True
  latent_scale_per_channel: True

model:
  params:
    first_stage_config:
      params:
        ckpt_path: ../outputs/MM_CelebA_Autoencoder/checkpoints/2025_06_20__22_34_18_new_hyp_z_comb_training/model_4400.pt

model_initialisation: ../outputs/MM_CelebA_Stable_Diffusion/checkpoints/2025_06_24__08_18_56_new_hyp_diff_train/model_6384.pt
init_from_stable_diffusion: False

defaults:
  - data: mm_celeba
  - model: v2-inference-mm-rgb-semseg
  - training: diffusion_training_default
  - sampler: ddim_timetravel
  - ema: dummy_ema
  - _self_
