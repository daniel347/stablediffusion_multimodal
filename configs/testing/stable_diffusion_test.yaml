seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "MM_CelebA_Stable_Diffusion"
print_freq: 50

function:
  name: test_epoch
  kwargs:
    epoch: 0

data:
  dataset_name: mm_celeba
  datadir:  ../../datasets/CelebAMask-HQ # ../mmvaeplus/data/CelebAMask-HQ  # ../../datasets/CelebAMask-HQ
  input_size: 128
  modalities: ["colour"]
  p_hor_flip: 0
  p_color_jitter: 0
  outputdir: ../outputs

training:
  use_mixed_precision: False

  lr: 8.0e-5
  gamma: 0.99
  batch_size: 32
  num_epochs: 10
  start_epoch: 0
  patience: 4
  test_only: False

  precompute_latents: True
  force_recompute: False
  precompute_latents_path: "latents_z_combined"
  compute_latent_scale: False

  z_mode: "z_combiner"  # one of ["random", "avg", "z_combiner" or an integer between 0 and NUM_VAES-1]

  grad_clipper:
    clip_percentile: 95
    clip_update_freq: 10
    keep_history_upto: 5000
    start_clip: 10

eval:
  inception_path: ./data/pt_inception-2015-12-05-6726825d.pth

model_conf: configs/stable-diffusion/v2-inference-mm-rgb-sd-ae.yaml
model_initialisation: # "../outputs/MM CelebA Autoencoder (Stable Diffusion)/checkpoints/2025_03_10__22_58_54/model_10.rar"
init_from_stable_diffusion: True
