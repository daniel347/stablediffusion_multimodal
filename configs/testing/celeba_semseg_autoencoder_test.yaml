seed: 1
device: "cuda:1"  # ["cuda:0", "cuda:1"]
experiment: "MM CelebA Autoencoder (Stable Diffusion)"
print_freq: 50

data:
  dataset_name: mm_celeba
  datadir:  ../../datasets/CelebAMask-HQ # ../mmvaeplus/data/CelebAMask-HQ  # ../../datasets/CelebAMask-HQ
  input_size: 128
  modalities: ["colour", "semseg"]

  outputdir: ../outputs

training:
  use_mixed_precision: False
  objective: dreg
  lr: 1.0e-4  # 3.0e-4
  batch_size: 8
  num_epochs: 5
  patience: 3

  weight_semseg_classes: semseg_class_freqs.pt

  beta: 2.5

  start_epoch: 4

  K: 1

  wlpips: [0.2, 0.0]
  wadversary: 0

  grad_clipper:
          clip_percentile: 95
          clip_update_freq: 10
          keep_history_upto: 5000
          start_clip: 10

  #discriminator:
  #  target: ldm.models.discriminator.MMDiscriminator
  #  params:
  #    disc_params:
  #      - in_size: 128
  #      - in_size: 128
  #discriminator_lr: 1.0e-4

eval:
  inception_path: ./data/pt_inception-2015-12-05-6726825d.pth

model_conf: configs/stable-diffusion/v2-inference-mm-rgb-semseg.yaml
model_initialisation: "../outputs/MM CelebA Autoencoder (Stable Diffusion)/checkpoints/2025_03_04__23_49_53/model_7.rar"
init_from_stable_diffusion: False
