seed: 1
device: "cuda:1"  # ["cuda:0", "cuda:1"]
experiment: "MM_CelebA_Stable_Diffusion"
print_freq: 50

function:
  name: generate_conditional
  kwargs: {n_samples: 16}

data:
  dataset_name: mm_celeba
  root_data_dir:  /home/ds3119/datasets/CelebAMask-HQ  # ../../datasets/CelebAMask-HQ  # ../../datasets/CelebAMask-HQ
  input_size: 128
  modality: ["colour", "semseg"]
  p_hor_flip: 0
  p_color_jitter: 0
  outputdir: ../outputs


training:
  use_mixed_precision: False

  lr: 5e-4
  gamma: 0.99
  batch_size: 1
  num_epochs: 20
  start_epoch: 0
  patience: 10
  test_only: False

  precompute_latents: False
  force_recompute: False
  precompute_latents_path:
  compute_latent_scale: False
  latent_scale_per_channel: False

  keep_intermediate_models: True  # With false only the best model and the last model is saved, otherwise all epochs showing improvement are saved.

  z_mode: "z_combiner"  # one of ["random", "avg", "z_combiner" or an integer between 0 and NUM_VAES-1]

  grad_clipper:
    clip_percentile: 95
    clip_update_freq: 10
    keep_history_upto: 5000
    start_clip: 10

  t_sampler:

ema:
  target: ldm.modules.ema.DummyEMA
  params: {}

# ema:
#   target: ldm.modules.ema.PowerFunctionEMA
#   params:
#     stds: [0.05, 0.10]

sampler:
  target: ldm.models.diffusion.ddim.DDIMSampler
  params: {}
  run_params:
    S: 200
    eta: 0.5
    timetravel_schedule: [[801, 851], [601, 651], [401, 451], [201, 251], [1, 51]]

guidance:
  guider:
    target: ldm.models.guidance.latent_dps.LatentDPS
    params:
      mod_weights: [1.0, 1.0]
      scale: 0.3
      manifold_constraint: True
      curvature_bound: 1000

  meas_confs:
    - null
    - target: ldm.models.guidance.latent_dps.IdentityMeasurement
      params: {}


eval:
  inception_path: ./data/pt_inception-2015-12-05-6726825d.pth

model_conf: configs/stable-diffusion/v2-inference-mm-rgb-semseg.yaml
model_initialisation: "/home/ds3119/multimodal_generation/outputs/MM_CelebA_Stable_Diffusion/checkpoints/2025_04_04__20_18_28_nvidia_ema/model_it20_ema_0.175.pt"
init_from_stable_diffusion: False
