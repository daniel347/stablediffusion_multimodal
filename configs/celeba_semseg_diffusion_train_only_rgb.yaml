seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "MM_CelebA_Stable_Diffusion"
print_freq: 50
outputdir: ../outputs

function:
  name: training_loop  # training_loop  # test_epoch
  kwargs: {}  # {out_epochs: [13, 17, 20], out_stds: [0.1, 0.125, 0.15, 0.175, 0.2, 0.225]}

dataset_name: mm_celeba

training:
  use_mixed_precision: False

  lr: 5e-4
  batch_size: 8
  num_epochs: 20
  start_iter: 0
  patience: 10

  precompute_latents: True
  force_recompute: True
  precompute_latents_path: ../../datasets/latents_precompute
  compute_latent_scale: True
  latent_scale_per_channel: False

  z_mode: "z_combiner"  # one of ["random", "avg", "z_combiner" or an integer between 0 and NUM_VAES-1]

model_initialisation: # "/home/ds3119/multimodal_generation/outputs/MM_CelebA_Stable_Diffusion/checkpoints/2025_04_28__11_18_27_32_latents/model_13.pt"
init_from_stable_diffusion: False

defaults:
  - data: mm_celeba
  - model: v2-inference-mm-rgb
  - training: diffusion_training_default
  - sampler: ddim_timetravel
  - ema: power_ema
  - override training/discriminator: mm_joint_discriminator_semseg
  - _self_
