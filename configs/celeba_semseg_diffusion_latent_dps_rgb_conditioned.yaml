seed: 1
device: "cuda:0"
experiment: "MM_CelebA_Stable_Diffusion"
name: "conditional_gen_rgb_from_semseg"
notes: "We test the multimodal diffusion model for conditional generation of RGB given the semantic segmentation map"
print_freq: 50

outputdir: ./outputs

function:
  name: generate_conditional
  kwargs: {n_samples: 16}

training:
  precompute_latents: False
  force_recompute: False
  compute_latent_scale: False
  latent_scale_per_channel: False

model_conf: configs/stable-diffusion/v2-inference-mm-rgb-semseg.yaml
model_initialisation: "/path/to/trained/multimodal/model"
init_from_stable_diffusion: False

defaults:
  - override /model: sit-mm-rgb-semseg
  - override /sampler: ddim_timetravel
  - override /ema: dummy_ema
  - training: diffusion_training_default
  - guidance: latent_dps_m1_to_m0
  - _self_
