seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "NYU_Depth_Stable_Diffusion"
print_freq: 50
outputdir: outputs
name: "nyu_lsun_diff"
notes: "We train diffusion on the latest autoencoder trained on nyu and lsun datasets"

function:
  name: training_loop
  kwargs: {}

dataset_name: nyu_depth_lsun  # name used when searching for image metrics

training:
  use_mixed_precision: False

  lr: 1.0e-4
  test_every_iter: 3000

  precompute_latents: True
  force_recompute: False
  precompute_latents_path: ./latents_precompute_nyu_lsun_full
  compute_latent_scale: True
  latent_scale_per_channel: True

model:
  params:
    first_stage_config:
      params:
        ckpt_path: "output_checkpoints/NYU_Depth_Autoencoder/checkpoints/2025_06_27__12_15_36_nyu_lsun_ae_z_comb/model_19000.pt"

model_initialisation:
init_from_stable_diffusion: False

defaults:
  - data: lsun_web
  - model: v2-inference-mm
  - training: diffusion_training_default
  - sampler: ddim_timetravel
  - ema: power_ema
  - _self_
