# rds/general/user/ds3119/ephemeral/outputs/NYU_Depth_Stable_Diffusion/checkpoints/2025_05_28__23_52_01_new_ae_train/model_21000.pt
# "/home/ds3119/multimodal_generation/trained_models/stable_diffusion_nyu_2025_02_07__11_11_50/model_5.rar"
init_from_stable_diffusion: False

defaults:
