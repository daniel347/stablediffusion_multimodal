target: SiT.sit_model.SiTModel
params:
  path_type: "Linear"
  prediction: "velocity"
  loss_weight: null
  input_shape: [768, 8, 8]

  scorenet_config:
    target: SiT.models.SiT
    params:
      depth: 12
      hidden_size: 768
      patch_size: 2
      num_heads: 12
      input_size: 8
      num_classes: null
      in_channels: 768
      n_cls_tokens: 2
      use_fp16: False

  first_stage_config:
    target: mae.models_disentangling_mae.DisMAE
    params:
      z_mode: "random"
      lik_dists: [ "torch.distributions.Laplace", "torch.distributions.Bernoulli" ]
      lik_dist_params:
        - scale: 0.01
        - {}
      w_len: 384
      z_len: 384
      scale_per_channel: False
      ckpt_path:

      vae_params:
        - target: mae.models_mae.MaskedAutoencoderViT  # RGB images
          params:
            img_size: 128
            patch_size: 16
            in_chans: 3
            embed_dim: 768
            depth: 12
            num_heads: 12
            decoder_embed_dim: 512
            decoder_depth: 8
            decoder_num_heads: 16
            mlp_ratio: 4

            quantiser:
              target: mae.vector_quantiser.VectorQuantiser
              params:
                n_e: 8192
                e_dim: 768
                beta: 0.25

        - target: mae.models_mae.MaskedAutoencoderViT  # Semantic Segmentation
          params:
            end_act: "sigmoid"
            img_size: 128
            patch_size: 16
            in_chans: 18
            embed_dim: 768
            depth: 12
            num_heads: 12
            decoder_embed_dim: 512
            decoder_depth: 8
            decoder_num_heads: 16
            mlp_ratio: 4

            quantiser:
              target: mae.vector_quantiser.VectorQuantiser
              params:
                n_e: 8192
                e_dim: 768
                beta: 0.25
