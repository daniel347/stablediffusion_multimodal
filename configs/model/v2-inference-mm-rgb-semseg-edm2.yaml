model:
  base_learning_rate: 1.0e-4  # not used
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: "jpg"
    cond_stage_key: "txt"
    input_shape: [6, 32, 32]
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: False
    reset_num_ema_updates: False
    parameterization: "x0"
    loss_type: "l2"
    learn_logvar: True

    unet_config:
      target: ldm.modules.diffusionmodules.networks_edm2.EDM2ScaleWrapper
      params:

        img_resolution: 32
        img_channels: 6
        label_dim: 0
        use_fp16: False

    first_stage_config:
      target: ldm.models.mmvae_autoencoder.MMVAEplus
      params:
        prior_dist: normal
        latent_channel_z: 2
        latent_channel_w: 2
        cross_w_mode: "sample"
        ckpt_path: "/home/ds3119/multimodal_generation/outputs/MM_CelebA_Autoencoder/checkpoints/2025_03_24__13_00_58_z_combiner_train/model_10.rar"
        avg_z: False
        all_combinations: False
        stop_self_z_grad: False
        scale_per_channel: False

        z_net_params:
          target: ldm.models.z_combiner_net.ZCombinerNet
          params:
            z_dim: 2
            dist_input_output: True  # work in terms of Normal distributions
            nz: 2
            ch: 32
            nblocks: 1

        vae_params:
          - target: ldm.models.autoencoder.AutoencoderKL  # RGB images
            params:
              embed_dim: 4  #  = latent_channel_z + latent_channel_w
              monitor: val/rec_loss
              embed_spatial_dim: 16
              ddconfig:
                #attn_type: "vanilla-xformers"
                double_z: true
                z_channels: 4  # This is really z + w channels
                w_channels: 2
                resolution: 256
                in_channels: 3
                out_ch: 3
                ch: 128
                ch_mult:
                - 1
                - 2
                - 4
                - 4
                num_res_blocks: 2
                attn_resolutions: []
                dropout: 0.0
                checkpoint: True
              lossconfig:
                target: torch.nn.Identity
          - target: ldm.models.autoencoder.AutoencoderKL  # Semantic Segmentation
            params:
              embed_dim: 4
              monitor: val/rec_loss
              embed_spatial_dim: 16
              conform_to_3_channel: false  # perform deterministic repetition and averaging to
                            # convert 1 channel to 3 channels and back, so we may start from pretrained encoder
              is_semseg: true
              likelihood_dist: Bernoulli  # torch.distribution.Bernoulli
              llik_scaling: 10.0

              ddconfig:
                #attn_type: "vanilla-xformers"
                double_z: true
                z_channels: 4
                w_channels: 2
                resolution: 256
                in_channels: 18
                out_ch: 18
                ch: 128
                ch_mult:
                - 1
                - 2
                - 4
                - 4
                num_res_blocks: 2
                attn_resolutions: []
                dropout: 0.0
                checkpoint: True
              lossconfig:
                target: torch.nn.Identity

    cond_stage_config: '__is_unconditional__'
