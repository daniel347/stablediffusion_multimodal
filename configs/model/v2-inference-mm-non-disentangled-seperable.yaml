base_learning_rate: 1.0e-4  # not used
target: ldm.models.diffusion.ddpm.LatentDiffusion
params:
  linear_start: 0.00085
  linear_end: 0.0120
  num_timesteps_cond: 1
  log_every_t: 200
  timesteps: 1000
  first_stage_key: "jpg"
  cond_stage_key: "txt"
  input_shape: [6, 16, 16]
  cond_stage_trainable: false
  conditioning_key: crossattn
  monitor: val/loss_simple_ema
  scale_factor: 0.18215
  use_ema: False # we handle EMA ourselves
  reset_num_ema_updates: False

  scorenet_config:
    target: ldm.modules.diffusionmodules.openaimodel.UNetModel
    params:
      use_checkpoint: False
      use_fp16: False
      image_size: 32 # unused
      in_channels: 6
      out_channels: 6
      model_channels: 128  # used to be 320
      attention_resolutions: [ 4, 2, 1 ]
      num_res_blocks: 2
      channel_mult: [ 1, 2, 4, 4 ]
      num_head_channels: 64 # need to fix for flash-attn
      use_spatial_transformer: False
      use_linear_in_transformer: True
      transformer_depth: 1
      context_dim:
      legacy: False

  first_stage_config:
    target: ldm.models.non_disentangled_autoencoder.NonDisentanglingAE
    params:
      prior_dist: normal
      latent_channel_u: 6
      ckpt_path: # "../outputs/MM CelebA Autoencoder (Stable Diffusion)/checkpoints/2025_03_18__13_42_43_single_ae_non_seperable_sd_init/model_18.rar"
      seperable: True
      lik_dist_splits: [ 3, 1 ]
      lik_dists: [ Laplace, Laplace]
      final_acts: [ identity, identity ]
      llik_scales: [ 1.0,  5.0 ]
      scale_per_channel: False

      vae_params:
        - target: ldm.models.autoencoder.AutoencoderKL  # RGB images
          params:
            embed_dim: 3  #  = latent_channel_z + latent_channel_w
            monitor: val/rec_loss
            embed_spatial_dim: 16
            return_lik_dist: False
            ddconfig:
              #attn_type: "vanilla-xformers"
              double_z: true
              z_channels: 3  # This is really z + w channels
              w_channels: 0  # Unused in this case
              resolution: 256
              in_channels: 3
              out_ch: 3
              ch: 128  # approx equal parameter numbers
              ch_mult:
                - 1
                - 2
                - 4
                - 4
              num_res_blocks: 2
              attn_resolutions: [ ]
              dropout: 0.0
              checkpoint: True
            lossconfig:
              target: torch.nn.Identity

        - target: ldm.models.autoencoder.AutoencoderKL  # depth images
          params:
            embed_dim: 3  #  = latent_channel_z + latent_channel_w
            monitor: val/rec_loss
            embed_spatial_dim: 16
            return_lik_dist: False
            ddconfig:
              #attn_type: "vanilla-xformers"
              double_z: true
              z_channels: 3  # This is really z + w channels
              w_channels: 0  # Unused in this case
              resolution: 256
              in_channels: 1  # 3 + 18
              out_ch: 1
              ch: 128  # approx equal parameter numbers
              ch_mult:
                - 1
                - 2
                - 4
                - 4
              num_res_blocks: 2
              attn_resolutions: [ ]
              dropout: 0.0
              checkpoint: True
            lossconfig:
              target: torch.nn.Identity
