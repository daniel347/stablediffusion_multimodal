target: SiT.sit_model.SiTModel
params:
  path_type: "Linear"
  prediction: "velocity"
  loss_weight: null
  input_shape: [6, 16, 16]

  scorenet_config:
    target: SiT.models.SiT
    params:
      depth: 12
      hidden_size: 768
      patch_size: 1  # put tokens in directly ( with projection )
      num_heads: 12
      input_size: 16
      num_classes: null
      in_channels: 6
      learn_sigma: False
      n_cls_tokens: 1

  first_stage_config:
    target: mae.models_disentangling_mae.DisMAE
    params:
      z_mode: "random"  # one of ["average", "random" or "z_combiner" ]
      lik_dists: [ "torch.distributions.Laplace"]
      lik_dist_params:
        - scale: 0.01
      w_len: 384
      z_len: 384
      scale_per_channel: false

      vae_params:
        - target: mae.models_mae.MaskedAutoencoderViT  # RGB images
          params:
            img_size: 128
            patch_size: 16
            in_chans: 3
            embed_dim: 768
            depth: 8
            num_heads: 12
            decoder_embed_dim: 768
            decoder_depth: 8
            decoder_num_heads: 12
            mlp_ratio: 4

            quantiser:
              target: mae.vector_quantiser.VectorQuantiser
              params:
                n_e: 8192
                e_dim: 768
                beta: 1
                normalise: True
