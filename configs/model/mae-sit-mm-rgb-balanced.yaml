target: SiT.sit_model.SiTModel
params:
  path_type: "Linear"
  prediction: "velocity"
  loss_weight: null
  input_shape: [32, 16, 16]

  scorenet_config:
    target: SiT.models.SiT
    params:
      depth: 12
      hidden_size: 768
      patch_size: 1  # put tokens in directly ( with projection )
      num_heads: 12
      input_size: 16
      num_classes: null
      in_channels: 32
      learn_sigma: False
      n_cls_tokens: 1
      use_fp16: False

  first_stage_config:
    target: mae.models_disentangling_mae.DisMAE
    params:
      z_mode: "random"  # one of ["average", "random" or "z_combiner" ]
      lik_dists: [ "torch.distributions.Laplace"]  # Laplace = L1 loss, Normal = L2 loss
      lik_dist_params:
        - scale: 1
      w_len: 16
      z_len: 16
      scale_per_channel: false
      ckpt_path:
      is_variational: False

      vae_params:
        - target: mae.models_mae.MaskedAutoencoderViT  # RGB images
          params:
            img_size: 128
            patch_size: 8
            in_chans: 3
            embed_dim: 192
            depth: 8
            num_heads: 12
            decoder_embed_dim: 192
            decoder_depth: 12
            decoder_num_heads: 12
            mlp_ratio: 4
            smooth_output: True
            latent_dim: 32

            quantiser:
              target: mae.vector_quantiser.VectorQuantiser
              params:
                n_e: 8192
                e_dim_in: 192
                e_dim: 32
                beta: 0
                normalise: True
