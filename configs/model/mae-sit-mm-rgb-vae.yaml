target: SiT.sit_model.SiTModel
params:
  path_type: "Linear"
  prediction: "velocity"
  loss_weight: null
  input_shape: [384, 8, 8]

  scorenet_config:
    target: SiT.models.SiT
    params:
      depth: 12
      hidden_size: 384
      patch_size: 1  # put tokens in directly ( with projection )
      num_heads: 12
      input_size: 8
      num_classes: null
      in_channels: 384
      learn_sigma: False
      n_cls_tokens: 1
      use_fp16: False

  first_stage_config:
    target: mae.models_disentangling_mae.DisMAE
    params:
      z_mode: "random"  # one of ["average", "random" or "z_combiner" ]
      lik_dists: [ "torch.distributions.Laplace"]
      lik_dist_params:
        - scale: 0.01
      w_len: 192
      z_len: 192
      scale_per_channel: false
      is_variational: true
      ckpt_path:

      vae_params:
        - target: mae.models_mae.MaskedAutoencoderViT  # RGB images
          params:
            img_size: 128
            patch_size: 16
            in_chans: 3
            embed_dim: 384
            depth: 8
            num_heads: 12
            decoder_embed_dim: 512
            decoder_depth: 8
            decoder_num_heads: 16
            mlp_ratio: 4