target: SiT.sit_model.SiTModel
params:
  path_type: "Linear"
  prediction: "velocity"
  loss_weight: null
  input_shape: [6, 16, 16]

  scorenet_config:
    target: SiT.models.SiT
    params:
      depth: 12
      hidden_size: 768
      patch_size: 2
      num_heads: 12

  first_stage_config:
    target: ldm.models.mmvae_autoencoder.MMVAEplus
    params:
      prior_dist: normal
      latent_channel_z: 2
      latent_channel_w: 2
      cross_w_mode: "sample"
      ckpt_path:
      avg_z: False
      all_combinations: False
      stop_self_z_grad: False
      scale_per_channel: False

      z_net_params:
        target: ldm.models.z_combiner_net.ZCombinerNet
        params:
          z_dim: 2
          dist_input_output: True  # work in terms of Normal distributions
          nz: 2
          ch: 32
          nblocks: 1

      vae_params:
        - target: ldm.models.autoencoder.AutoencoderKL  # RGB images
          params:
            embed_dim: 4  #  = latent_channel_z + latent_channel_w
            monitor: val/rec_loss
            embed_spatial_dim: 16
            ddconfig:
              #attn_type: "vanilla-xformers"
              double_z: true
              z_channels: 4  # This is really z + w channels
              w_channels: 2
              resolution: 256
              in_channels: 3
              out_ch: 3
              ch: 128
              ch_mult:
              - 1
              - 2
              - 4
              - 4
              num_res_blocks: 2
              attn_resolutions: []
              dropout: 0.0
              checkpoint: True
            lossconfig:
              target: torch.nn.Identity
        - target: ldm.models.autoencoder.AutoencoderKL  # Semantic Segmentation
          params:
            embed_dim: 4
            monitor: val/rec_loss
            embed_spatial_dim: 16
            conform_to_3_channel: false  # perform deterministic repetition and averaging to
                          # convert 1 channel to 3 channels and back, so we may start from pretrained encoder
            is_semseg: true
            likelihood_dist: Bernoulli  # torch.distribution.Bernoulli
            llik_scaling: 10.0

            ddconfig:
              #attn_type: "vanilla-xformers"
              double_z: true
              z_channels: 4
              w_channels: 2
              resolution: 256
              in_channels: 18
              out_ch: 18
              ch: 128
              ch_mult:
              - 1
              - 2
              - 4
              - 4
              num_res_blocks: 2
              attn_resolutions: []
              dropout: 0.0
              checkpoint: True
            lossconfig:
              target: torch.nn.Identity

  cond_stage_config: '__is_unconditional__'
