# @package _global_

seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]

experiment: "NYU_Depth_Autoencoder"
name: "nyu_lsun_ae"
notes: "We train the multimodal autoencoder on the NYU depth and LSUN bedroom datasets with RGB and synthetic depth labels"

print_freq: 50
outputdir: ./outputs

function:
  name: training_loop
  params: {}

training:
  model_opts: {}
  weight_decay: 0.0
  objective:
    params:
      wlpips: [ 7000, 7000.0 ]
      wadversary: 10000
      mmd_zw_weight: 3500.0
      mmd_ww_weight: 3000.0

  start_iter: 0
  test_every_iter: 3000
  compute_metrics: True

# the FID reference file is found as {fid_ref_name}_{modality}_{fid_ref_split}.npz in the pyiqa cache directory
fid_ref_name: "nyu_depth_lsun"
fid_ref_split: "val"

model_initialisation: # "../outputs/NYU_Depth_Autoencoder/checkpoints/2025_05_20__19_09_36_new_ae_arch/model_2.pt" # "../trained_models/model_8.rar"
resume_training: false
init_from_stable_diffusion: True

defaults:
  - data: lsun_web
  - model: v2-inference-mm
  - training: autoencoder_training_default
  - override training/discriminator: mm_joint_discriminator_rgb_depth
  - _self_
