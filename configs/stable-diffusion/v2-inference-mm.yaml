model:
  base_learning_rate: 1.0e-4  # not used
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: "jpg"
    cond_stage_key: "txt"
    input_shape: [6, 16, 16]
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: False # we handle EMA ourselves
    reset_num_ema_updates: False

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        use_checkpoint: False
        use_fp16: False
        image_size: 32 # unused
        in_channels: 6
        out_channels: 6
        model_channels: 128  # used to be 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_head_channels: 64 # need to fix for flash-attn
        use_spatial_transformer: False
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim:
        legacy: False

    first_stage_config:
      target: ldm.models.mmvae_autoencoder.MMVAEplus
      params:
        prior_dist: normal
        latent_channel_z: 2
        latent_channel_w: 2
        cross_w_mode: "sample"
        ckpt_path: # "../outputs/NYU_Depth_Autoencoder/checkpoints/2025_06_11__21_13_53_z_combiner_frozen_decoder/model_1200.pt"
        avg_z: False
        all_combinations: False
        stop_self_z_grad: False
        scale_per_channel: False

        z_net_params:
          target: ldm.models.z_combiner_net.ZCombinerNet
          params:
            z_dim: 2
            dist_input_output: True  # work in terms of Normal distributions
            nz: 2
            ch: 32
            nblocks: 1

        vae_params:
          - target: ldm.models.autoencoder.AutoencoderKL  # RGB images
            params:
              embed_dim: 4  #  = latent_channel_z + latent_channel_w
              monitor: val/rec_loss
              embed_spatial_dim: 16
              llik_scaling: 1
              ddconfig:
                #attn_type: "vanilla-xformers"
                double_z: true
                z_channels: 4  # This is really z + w channels
                w_channels: 2
                resolution: 256
                in_channels: 3
                out_ch: 3
                ch: 128
                ch_mult:
                - 1
                - 2
                - 4
                - 4
                num_res_blocks: 2
                attn_resolutions: []
                dropout: 0.0
                checkpoint: True
              lossconfig:
                target: torch.nn.Identity
          - target: ldm.models.autoencoder.AutoencoderKL  # Depth map
            params:
              embed_dim: 4
              monitor: val/rec_loss
              embed_spatial_dim: 16
              conform_to_3_channel: true  # perform deterministic repetition and averaging to
              # convert 1 channel to 3 channels and back, so we may start from pretrained encoder
              llik_scaling: 5
              ddconfig:
                #attn_type: "vanilla-xformers"
                double_z: true
                z_channels: 4
                w_channels: 2
                resolution: 256
                in_channels: 1
                out_ch: 1
                ch: 128
                ch_mult:
                - 1
                - 2
                - 4
                - 4
                num_res_blocks: 2
                attn_resolutions: []
                dropout: 0.0
                checkpoint: True
              lossconfig:
                target: torch.nn.Identity

    cond_stage_config: '__is_unconditional__'
