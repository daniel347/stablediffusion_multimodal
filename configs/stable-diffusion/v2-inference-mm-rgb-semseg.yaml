model:
  base_learning_rate: 1.0e-4  # not used
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: "jpg"
    cond_stage_key: "txt"
    input_shape: [6, 16, 16]
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: True
    reset_num_ema_updates: False

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        use_checkpoint: False
        use_fp16: False
        image_size: 32 # unused
        in_channels: 6
        out_channels: 6
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_head_channels: 64 # need to fix for flash-attn
        use_spatial_transformer: False
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim:
        legacy: False

    first_stage_config:
      target: ldm.models.mmvae_autoencoder.MMVAEplus
      params:
        prior_dist: normal
        latent_channel_z: 2
        latent_channel_w: 2
        cross_w_mode: "sample"
        ckpt_path: # "../trained_models/stable_diff_mmvae_nyu_z2_w2_2025_01_31__21_33_44/model_8.rar"

        vae_params:
          - target: ldm.models.autoencoder.AutoencoderKL  # RGB images
            params:
              embed_dim: 4  #  = latent_channel_z + latent_channel_w
              monitor: val/rec_loss
              embed_spatial_dim: 16
              ddconfig:
                #attn_type: "vanilla-xformers"
                double_z: true
                z_channels: 4  # This is really z + w channels
                w_channels: 2
                resolution: 256
                in_channels: 3
                out_ch: 3
                ch: 128
                ch_mult:
                - 1
                - 2
                - 4
                - 4
                num_res_blocks: 2
                attn_resolutions: []
                dropout: 0.0
                checkpoint: True
              lossconfig:
                target: torch.nn.Identity
          - target: ldm.models.autoencoder.AutoencoderKL  # Semantic Segmentation
            params:
              embed_dim: 4
              monitor: val/rec_loss
              embed_spatial_dim: 16
              conform_to_3_channel: false  # perform deterministic repetition and averaging to
                            # convert 1 channel to 3 channels and back, so we may start from pretrained encoder
              is_semseg: true
              likelihood_dist: Bernoulli  # torch.distribution.Bernoulli

              ddconfig:
                #attn_type: "vanilla-xformers"
                double_z: true
                z_channels: 4
                w_channels: 2
                resolution: 256
                in_channels: 18
                out_ch: 18
                ch: 128
                ch_mult:
                - 1
                - 2
                - 4
                - 4
                num_res_blocks: 2
                attn_resolutions: []
                dropout: 0.0
                checkpoint: True
              lossconfig:
                target: torch.nn.Identity

    cond_stage_config: '__is_unconditional__'
