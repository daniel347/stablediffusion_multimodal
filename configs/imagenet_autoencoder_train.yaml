# @package _global_

seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "ImageNet_Autoencoder"
print_freq: 50
outputdir: ../outputs # /rds/general/user/ds3119/ephemeral/outputs
name: "imagenet_ae"
notes: "We try training our best model on NYU depth and LSUN"

function:
  name: training_loop
  params: {}

dataset_name: imagenet

training:

  model_opts: {}
  test_every_iter: 200 # test and save the model every so many iterations
  objective:
    params:
      wlpips: [ 0.5, 0.5 ]
      wadversary: 0.01
      mmd_zw_weight: 0.002
      mmd_ww_weight: 0.002

model_initialisation: # "../outputs/NYU_Depth_Autoencoder/checkpoints/2025_05_20__19_09_36_new_ae_arch/model_2.pt" # "../trained_models/model_8.rar"
resume_training: false
init_from_stable_diffusion: True

defaults:
  - data: imagenet_local
  - model: v2-inference-mm-imagenet-class-cond
  - training: autoencoder_training_default
  - override training/discriminator: mm_joint_discriminator_rgb_depth
  - _self_
