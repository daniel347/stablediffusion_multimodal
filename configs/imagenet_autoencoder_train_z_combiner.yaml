# @package _global_

seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "ImageNet_Autoencoder"
print_freq: 50
outputdir:  /rds/general/user/ds3119/ephemeral/outputs
name: "imagenet_ae_z_comb"
notes: "We train the z combiner on our imagenet checkpoint. Note the first stage hasnt really converged yet so this is just an experiment."

function:
  name: training_loop
  params: {}

dataset_name: imagenet

training:
  lr: 1e-3
  model_opts: {}
  test_every_iter: 200 # test and save the model every so many iterations
  objective:
    params:
      wlpips: [ 3, 3 ]
      wadversary: 0.05
      mmd_zw_weight: 0.002
      mmd_ww_weight: 0.002
      beta: 1e-6

  objective_is_z_combiner: True
  lr_decoder: 3e-4  # Smaller rate for decoders in z_combiner_training

model_initialisation: "/rds/general/user/ds3119/ephemeral/outputs/ImageNet_Autoencoder/checkpoints/2025_12_09__16_56_06_imagenet_ae/model_8000.pt"
# "../outputs/NYU_Depth_Autoencoder/checkpoints/2025_05_20__19_09_36_new_ae_arch/model_2.pt" # "../trained_models/model_8.rar"
resume_training: false
init_from_stable_diffusion: False

defaults:
  - data: imagenet
  - model: v2-inference-mm-imagenet-class-cond
  - training: autoencoder_training_default
  - override training/discriminator: mm_joint_discriminator_rgb_depth
  - override training/objective: 4way_z_combiner_objective
  - _self_
