# @package _global_

seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "MM_CelebA_Autoencoder"
print_freq: 50
outputdir: /rds/general/user/ds3119/ephemeral/outputs

function:
  name: training_loop
  params: {}

dataset_name: mm_celeba

training:
  objective:
    params:
      wlpips: [5000, 0]
      wadversary: 2000
      mmd_zw_weight: 1500.0
      mmd_ww_weight: 1500.0
      wll: 0.002
      beta: 1

  start_iter: 0
  test_every_iter: 400
  compute_metrics: True

model_initialisation: # "../outputs/MM_CelebA_Autoencoder/checkpoints/2025_03_21__23_27_35_new_obj_z_dist_mmd/model_10.rar"
init_from_stable_diffusion: True

defaults:
  - data: mm_celeba
  - ema: dummy_ema
  - model: v2-inference-mm-rgb-semseg-lora
  - training: autoencoder_training_default
  - override training/discriminator: mm_joint_discriminator_semseg
  - _self_
