# @package _global_

seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]

experiment: "MM_CelebA_Autoencoder"
name: "autoencoder_train"
notes: "We train the multimodal autoencoder on the MM CelebA dataset with RGB and semantic segmentation inputs."

print_freq: 50
outputdir: ./outputs

function:
  name: training_loop
  params: {}

dataset_name: mm_celeba

training:
  model_opts: {}
  weight_decay: 0.0
  objective:
    params:
      legacy: True
      wlpips: [5000, 0]
      wadversary: 2000
      mmd_zw_weight: 1500.0
      mmd_ww_weight: 1500.0
      wll: 1
      beta: 1

  start_iter: 0
  test_every_iter: 400
  compute_metrics: True

model_initialisation:
init_from_stable_diffusion: True

# the FID reference file is found as {fid_ref_name}_{modality}_{fid_ref_split}.npz in the pyiqa cache directory
fid_ref_name: "mm_celeba"
fid_ref_split: "all"

defaults:
  - data: mm_celeba
  - ema: dummy_ema
  - model: v2-inference-mm-rgb-semseg
  - training: autoencoder_training_default
  - override training/discriminator: mm_joint_discriminator_semseg
  - _self_
