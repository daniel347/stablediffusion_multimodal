# @package _global_

name: "nyu_lsun_ae_diff_test_metrics_new_ref"
notes: "We test metrics for the nyu_lsun_full_ae_diff model."

function:
  name: test_metrics
  kwargs: {subepoch: 0, itercount: 0, epochcount: 0, n_samples: 10000, gen_samples: True, metrics: ["fid", "kid", "tce", "tie", "cmmd"]}

training:
  precompute_latents: True
  force_recompute: False
  latent_scale_per_channel: True
  precompute_latents_path: ./latents_precompute_lsun
  compute_latent_scale: True

model:
  params:
    first_stage_config:
      params:
        # The VAE weights are contained in the diffusion checkpoint so no need to load separately
        ckpt_path: null

model_initialisation: /path/to/trained/diffusion/checkpoint

defaults:
  - override /data: nyu_depth_lsun_bedroom
  - override /ema: dummy_ema
  - _self_
