# @package _global_

name: "nyu_lsun_joint_diff"
notes: "We train diffusion with our joint NYU LSUN autoencoder as a baseline. We also employ sampling of the latent space during the diffusion training"

training:
  precompute_latents: True
  force_recompute: False
  precompute_latents_path: /rds/general/user/ds3119/ephemeral/latents_precompute_joint
  latent_scale_per_channel: True
  compute_latent_scale: True

  patience: 20
  num_epochs: 10

model:
  params:
    first_stage_config:
      params:
        ckpt_path: "/rds/general/user/ds3119/ephemeral/outputs/NYU_Depth_Autoencoder/checkpoints/2025_06_27__12_21_31_nyu_lsun_joint/model_12000.pt"

model_initialisation: "/rds/general/user/ds3119/ephemeral/outputs/NYU_Depth_Stable_Diffusion/checkpoints/2025_07_09__10_12_15_nyu_lsun_joint_diff/model_33000.pt"

defaults:
  - override /model: v2-inference-mm-non-disentangled-non-seperable 
  - _self_
