# @package _global_

outputdir: /rds/general/user/ds3119/ephemeral/outputs
device: "cuda:0"
name: "celeba_mae_train_resample_vq_warm_start"
notes: "We try training our MAE on CelebA rgb images, initialising the model from a vq free trained checkpoint. We project the codewords up to the right size and also resample the code book every 1000. We start with 6000 unquantised iterations"

training:
  lr: 1e-4
  num_epochs: 60
  patience: 60  # dont early stop
        
  model_opts:
    total_mask_ratio: 0.5
    shared_mask_ratio: 0.75

  test_every_iter: 1000
  objective:
    params:        
      start_adv_iter: 2000
      wadversary: 50
      mmd_zw_weight: 0.0
      freq_vq_resample: 2000
      stop_vq_resample: 12000
      vq_resample_noise: 0.03
      start_vq: 6000


  discriminator:
    discriminator_lr: 4e-4

model_initialisation: # "/rds/general/user/ds3119/ephemeral/outputs/MM_CelebA_Autoencoder/checkpoints/2025_10_21__09_24_46_celeba_mae_train_no_vq/model_22000.pt"


# "/rds/general/user/ds3119/ephemeral/outputs/MM_CelebA_Autoencoder/checkpoints/2025_11_04__17_09_45_celeba_mae_train_contract_vq_warm_start/model_29000.pt"

# "C:/Users/daniel/Documents/ImperialCodeStuff/stablediffusion_multimodal/output_checkpoints/MM_CelebA_Autoencoder/2025_11_04__17_09_45_celeba_mae_train_contract_vq_warm_start/model_29000.pt"
# "/rds/general/user/ds3119/ephemeral/outputs/MM_CelebA_Autoencoder/checkpoints/2025_10_21__09_24_46_celeba_mae_train_no_vq/model_22000.pt" # "C:/Users/daniel/Documents/ImperialCodeStuff/stablediffusion_multimodal/output_checkpoints/MM_CelebA_Autoencoder/2025_10_21__09_24_46_celeba_mae_train_no_vq/model_22000.pt" #
init_from_stable_diffusion: False
init_from_mae: True
resume_training: False


defaults:
  - override /model: mae-sit-mm-rgb-balanced
  - _self_
