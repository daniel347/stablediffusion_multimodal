# @package _global_

outputdir: /rds/general/user/ds3119/ephemeral/outputs
device: "cuda:0"
name: "celeba_mae_train_contract_vq_warm_start"
notes: "We try training our MAE on CelebA rgb images, initialising the model from a vq free trained checkpoint"

training:
  lr: 0.5e-5
  num_epochs: 60
  patience: 60  # dont early stop
        
  model_opts:
    total_mask_ratio: 0.5
    shared_mask_ratio: 0.75

  test_every_iter: 1000
  objective:
    params:        
      start_adv_iter: 2000
      wadversary: 2
      mmd_zw_weight: 0.0

  discriminator:
    discriminator_lr: 4e-4

model_initialisation: "/rds/general/user/ds3119/ephemeral/outputs/MM_CelebA_Autoencoder/checkpoints/2025_10_21__09_24_46_celeba_mae_train_no_vq/model_22000.pt"
init_from_stable_diffusion: False
init_from_mae: False
# resume_training: True


defaults:
  - override /model: mae-sit-mm-rgb
  - _self_
