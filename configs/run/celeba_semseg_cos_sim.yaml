# @package _global_

name: "cos_sim_z_comb"
notes: "We train the autoencoder with a cosine similarity independence objective in place of the MMD loss. We now train the z combiner."

num_epochs: 5

training:
  objective:
    params:
      mmd_zw_weight: 0.0
      mmd_ww_weight: 0.0
      cos_zw_weight: 1000.0
      cos_ww_weight: 1000.0
