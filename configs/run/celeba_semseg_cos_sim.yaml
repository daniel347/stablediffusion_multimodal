# @package _global_

name: "cos_sim"
notes: "We train the autoencoder with a cosine similarity independence objective in place of the MMD loss"

num_epochs: 10

training:
  objective:
    params:
      mmd_zw_weight: 0.0
      mmd_ww_weight: 0.0
      cos_zw_weight: 1000.0
      cos_ww_weight: 1000.0