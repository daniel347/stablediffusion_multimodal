# @package _global_

outputdir: /rds/general/user/ds3119/ephemeral/outputs
device: "cuda:0"
name: "celeba_orig_sd_test_fid"
notes: "We check the performance of the original SD model on CelebA images, using FID. We test with 256 size to see if this makes a difference"

