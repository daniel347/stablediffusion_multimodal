# @package _global_

outputdir: /rds/general/user/ds3119/ephemeral/outputs
device: "cuda:0"
name: "celeba_orig_sd_lora_train"
notes: "We check the performance of the original SD model on CelebA images finetuning with LoRAConv. We try with less L1 and moderate l1-lpips"

training:
  lora_finetune: True
  lora_bias_mode: "none" # none, all, lora_only
  lr: 1e-4

  objective:
    params:
      wlpips: 5000
      wadversary: 2000
      wll: 0.001

defaults:
  - override /model: v2-inference-rgb-orig-lora
