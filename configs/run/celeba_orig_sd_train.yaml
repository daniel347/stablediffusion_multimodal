# @package _global_

outputdir: /rds/general/user/ds3119/ephemeral/outputs
device: "cuda:0"
name: "celeba_orig_sd_train"
notes: "We check the performance of the original SD model on CelebA images finetuning over all parameters. We try with more L1 and less lpips"

training:
  lr: 1e-4

  objective:
    params:
      wlpips: 10000
      wadversary: 2000
      wll: 0.05

defaults:
  - override /model: v2-inference-rgb-orig
