# @package _global_

name: "sit_diff_long_ema_opt"
notes: "We optimise EMA for the SiT diffusion with our disentangling autoencoder after finetuning the z combiner to be more realistic. We have trained the diffusion model for a long time"

function:
  name: test_optimum_EMA
  kwargs: {out_nimgs: [20376000, 9936000], out_stds: [0.05, 0.075, 0.1, 0.125, 0.15, 0.175, 0.2], n_samples: 256}

training:
  precompute_latents: True
  force_recompute: False
  precompute_latents_path: /rds/general/user/ds3119/ephemeral/latents_precompute_low_l1_finetune
  latent_scale_per_channel: True
  compute_latent_scale: True

  patience: 20

model:
  params:
    first_stage_config:
      params:
        ckpt_path:

model_initialisation:  "/rds/general/user/ds3119/ephemeral/outputs/MM_CelebA_Stable_Diffusion/checkpoints/2025_10_11__16_00_55_sit_diff/model_283000.pt" 

defaults:
  - override /model: sit-mm-rgb-semseg
  - override /sampler: ddpm
  - override /ema: dummy_ema
  - _self_
