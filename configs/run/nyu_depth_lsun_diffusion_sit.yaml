# @package _global_

name: "sit_diff_full_lsun"
notes: "We retrain our best nyu lsun autoencoder using the SiT diffusion model."

function:
  name: training_loop
  kwargs: {}

training:
  num_epochs: 48
  resume_training: False

  precompute_latents: True
  force_recompute: False
  precompute_latents_path: ./latents_precompute_lsun
  compute_latent_scale: True
  latent_scale_per_channel: True

model:
  params:
    first_stage_config:
      params:
        ckpt_path: "/path/to/trained/autoencoder/checkpoint"  # Set the trained autoencoder checkpoint here
model_initialisation:

defaults:
  - override /model: sit-mm-rgb-depth
  - override /sampler: ddpm
  - override /data: lsun_web
  - _self_
