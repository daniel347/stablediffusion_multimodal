  patience: 20

  z_mode: "random"

model:
  params:
    first_stage_config:
      params:
        ckpt_path: "/rds/general/user/ds3119/ephemeral/outputs/MM_CelebA_Autoencoder/checkpoints/2025_06_18__20_23_48_obj_hyp_opt/model_2800.pt"

defaults:
  - _self_