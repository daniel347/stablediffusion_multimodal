# @package _global_

name: "z_comb_ablation"
notes: "We train diffusion with our best autoencoder but without z combiner We instead choose one of the zs at random during training. We also employ sampling of the latent space during the diffusion training"

training:
  precompute_latents: True
  force_recompute: True
  precompute_latents_path: /rds/general/user/ds3119/ephemeral/latents_precompute_z_comb_ablation
  latent_scale_per_channel: True
