# @package _global_

outputdir: outputs
device: "cuda:0"
name: "separate_cluster_latents_classes"
notes: "We test on imagenet and cluster the latents into discrete classes. This is a rather unfair test as the model has not seen imagenet during training."

function:
  name: cluster_latents_with_class
  params: {n_batches: 600}

dataset_name: nyu_depth_lsun

data:
  returns_class: True

model:
  params:
    first_stage_config:
      params:
        ckpt_path: null
model_initialisation:
init_from_stable_diffusion: True

defaults:
  - override /model: v2-inference-mm-non-disentangled-seperable
  - override /data: nyu_labelled_local