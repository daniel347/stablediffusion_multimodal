# @package _global_

name: "sit_diff_optimise_ema"
notes: "we optimise EMA for the SiT diffusion model using the NYU Depth and LSUN Bedroom datasets."

function:
  name: test_optimum_EMA
  kwargs: {out_nimgs: [10368000], out_stds: [0.05, 0.075, 0.1, 0.125, 0.15, 0.175, 0.2], n_samples: 256}


training:
  num_epochs: 48
  resume_training: False

  precompute_latents: True
  force_recompute: False
  latent_scale_per_channel: True
  precompute_latents_path: ./latents_precompute_lsun_full
  compute_latent_scale: True

model:
  params:
    first_stage_config:
      params:
        ckpt_path:

model_initialisation: "./path/to/trained/diffusion/model"

defaults:
  - override /data: nyu_depth_lsun_bedroom
  - override /ema: dummy_ema
  - override /model: sit-mm-rgb-depth
  - override /sampler: ddpm  # We dont actually use DDPM here we use the velocity parametrisation in SiT
  - _self_
