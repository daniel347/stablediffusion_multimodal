# @package _global_

name: "sit_diff_long_test_metrics"
notes: "We compute generation metrics for the SiT diffusion using the ode sampler"

function:
  name: test_metrics
  kwargs: {subepoch: 0, itercount: 0, epochcount: 0, n_samples: 10000, gen_samples: True}

training:
  precompute_latents: True
  force_recompute: False
  precompute_latents_path: /rds/general/user/ds3119/ephemeral/latents_precompute_low_l1_finetune
  latent_scale_per_channel: True
  compute_latent_scale: True

  patience: 20

model:
  params:
    first_stage_config:
      params:
        ckpt_path:

    use_ode: True
    sampler_kwargs: 
        atol: 2.5e-7
        rtol: 2.5e-4

model_initialisation:  "/rds/general/user/ds3119/ephemeral/outputs/MM_CelebA_Stable_Diffusion/checkpoints/2025_10_11__16_00_55_sit_diff/model_it138000_ema_0.200.pt" 

defaults:
  - override /model: sit-mm-rgb-semseg
  - override /sampler: ddpm
  - override /ema: dummy_ema
  - _self_
