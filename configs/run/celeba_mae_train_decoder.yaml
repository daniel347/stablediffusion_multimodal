# @package _global_

outputdir: /rds/general/user/ds3119/ephemeral/outputs
device: "cuda:0"
name: "celeba_mae_train_decoder_finetune"
notes: "We try training our MAE on CelebA rgb images with the parameters of the VMAE. We project the codewords up to the right size and also resample the code book every 2000 iterations. We start with 6000 unquantised iterations"

training:
  weight_decay: 0.05
  lr: 2e-5
  num_epochs: 60
  patience: 60  # dont early stop
  batch_size: 256

  model_opts:
    total_mask_ratio: 0.5
    shared_mask_ratio: 1.0

  test_every_iter: 1000
  objective:
    params:        
      start_adv_iter: 2000
      wadversary: 0.0
      wlpips: [10]
      mmd_zw_weight: 0.0
      wll: 1.0
      kl_weight: 0
      freq_vq_resample: 2000
      stop_vq_resample: 0
      vq_resample_noise: 0.03
      start_vq: 0
      beta: 0.1
      decoder_only: True

  discriminator:
    discriminator_lr: 4e-4

model_initialisation: "/rds/general/user/ds3119/ephemeral/outputs/MM_CelebA_Autoencoder/checkpoints/2026_01_16__10_36_33_celeba_mae_train/model_16000.pt" 
init_from_stable_diffusion: False
init_from_mae: False
resume_training: False


defaults:
  - override /model: mae-sit-mm-rgb-balanced
  - _self_
