# @package _global_

outputdir: /rds/general/user/ds3119/ephemeral/outputs
device: "cuda:0"
name: "celeba_orig_sd_lora_ema_opt"
notes: "We check the performance of the original SD model on CelebA images finetuning with LoRAConv"

function:
  name: test_optimum_EMA
  params: {out_nimgs: [256000, 153600], out_stds: [0.05, 0.075, 0.1, 0.125, 0.15]}

training:
  lora_finetune: True
  lora_bias_mode: "none" # none, all, lora_only
  lr: 1e-4

  objective:
    params:
      wlpips: 50000
      wadversary: 500
      wll: 0.05

model_initialisation: /rds/general/user/ds3119/ephemeral/outputs/MM_CelebA_Autoencoder/checkpoints/2025_09_19__17_24_23_celeba_orig_sd_lora_train/model_4000.pt

defaults:
  - override /model: v2-inference-rgb-orig-lora
  - override /ema: dummy_ema
