# @package _global_

outputdir: /rds/general/user/ds3119/ephemeral/outputs
device: "cuda:0"
name: "celeba_mae_sit_train"
notes: "We try training diffusion on the MAE latent space with no regularisation - I expect this to go badly!"

training:
  precompute_latents: True
  force_recompute: False
  precompute_latents_path: latents_precompute_rgb_mae_no_reg  # /rds/general/user/ds3119/ephemeral/
  latent_scale_per_channel: False
  compute_latent_scale: True

  patience: 20

  test_every_iter: 3000

data:
  modality: ["colour"]

model:
  params:
    first_stage_config:
      params:
        ckpt_path: "output_checkpoints/MM_CelebA_Autoencoder/checkpoints/2025_10_21__09_24_46_celeba_mae_train_no_vq/model_22000.pt"  # /rds/general/user/ds3119/ephemeral/

defaults:
  - override /model: mae-sit-mm-rgb-no-quant
  - override /sampler: ddpm
  - _self_
