  params: {n_batches: 600}

dataset_name: nyu_depth_lsun

data:
  returns_class: True

model_initialisation: "output_checkpoints/NYU_Depth_Autoencoder/checkpoints/2025_06_27__12_21_31_nyu_lsun_joint/model_12000.pt"

defaults:
  - override /model: v2-inference-mm-non-disentangled-non-seperable
  - override /data: nyu_labelled_local