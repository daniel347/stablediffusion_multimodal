# @package _global_

experiment: "NYU_Depth_Autoencoder"
name: "nyu_lsun_ae_z_comb"
notes: "We train the NYU LSUN autoencoder z combiner"

training:
  test_every_iter: 1000 # test and save the model every so many iterations
  objective:
    params:
      wlpips: [ 7000, 7000.0 ]
      wadversary: 10000
      mmd_zw_weight: 3500.0
      mmd_ww_weight: 3000.0

  objective_is_z_combiner: True
  lr_decoder: 6e-5  # Smaller rate for decoders in z_combiner_training

model_initialisation: # Path to model training from which to start training the z combiner.
resume_training: False
init_from_stable_diffusion: False

defaults:
  - override /training/objective: 4way_z_combiner_objective