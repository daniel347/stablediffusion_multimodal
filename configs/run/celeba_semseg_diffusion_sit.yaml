# @package _global_

name: "sit_diff"
notes: "We train an SiT based diffusion on CelebA multimodal"

training:
  precompute_latents: True
  force_recompute: True
  precompute_latents_path: ./latents_precompute_low_l1_finetune
  latent_scale_per_channel: True
  compute_latent_scale: True

  patience: 50
  test_every_iter: 5000
  num_epochs: 50

model:
  params:
    first_stage_config:
      params:
        ckpt_path: "/path/to/trained/autoencoder/checkpoint"  # Set the trained autoencoder checkpoint here

model_initialisation:

defaults:
  - override /model: sit-mm-rgb-semseg
  - override /sampler: ddpm
  - _self_
