project: "MM_CelebA_Autoencoder"
program: train_mm_autoencoder_image_depth.py

method: bayes
metric:
    name: kid_sum
    goal: minimize

parameters:
  training.objective.params.wlpips.0:
    distribution: q_uniform
    min: 100
    max: 100000
    q: 1000
  training.objective.params.wadversary:
    distribution: q_uniform
    min: 100
    max: 3000
    q: 100

early_terminate:
  type: hyperband
  min_iter: 400
  max_iter: 2400

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}


