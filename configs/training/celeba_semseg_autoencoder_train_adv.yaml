seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "MM_CelebA_Autoencoder"
print_freq: 50
outputdir: /rds/general/user/ds3119/ephemeral/outputs  # ../outputs  #

function:
  name: training_loop
  params: {}

dataset_name: mm_celeba  # name used when searching for image metrics
data:
  dataset_name: mm_celeba
  root_data_dir:  ../../datasets/CelebAMask-HQ # ../mmvaeplus/data/CelebAMask-HQ  # ../../datasets/CelebAMask-HQ
  input_size: 128
  force_reload: True
  modality: ["colour", "semseg"]


training:
  use_mixed_precision: False
  objective:
    name: disentangling_objective
    params:
      wlpips: [1000, 0.0]
      wadversary: 3
      start_adv_iter: 200
      beta: 1
      channel_weighting: # semseg_class_freqs.pt
      z_close_weight: 500000 # 0.1
      off_combination_weight: 0.0
      mmd_zw_weight: 1000.0  # 1000.0
      mmd_ww_weight: 1000.0  # 1000.0


  lr: 2.0e-4  # 3.0e-4
  batch_size: 64
  num_epochs: 20  # Will be interpreted as subepochs if test_every_iter is set
  patience: 4  # Will be interpreted as subepochs if test_every_iter is set
  test_every_iter: 200

  start_iter: 0
  K: 1

  grad_clipper:
    clip_percentile: 95
    clip_update_freq: 10
    keep_history_upto: 5000
    start_clip: 10

  discriminator:
    target: ldm.models.discriminator.MMJointDiscriminator
    params:
      disc_params:
        target: ldm.models.discriminator.PatchDiscriminator
        params:
          input_nc: 21
  discriminator_lr: 5.0e-5

eval:
  inception_path: ./data/pt_inception-2015-12-05-6726825d.pth

model_conf: configs/stable-diffusion/v2-inference-mm-rgb-semseg.yaml
model_initialisation: /rds/general/user/ds3119/ephemeral/outputs/MM_CelebA_Autoencoder/checkpoints/2025_06_12__14_54_29_patch_disc_train/model_200.pt
resume_training: True
init_from_stable_diffusion: False
