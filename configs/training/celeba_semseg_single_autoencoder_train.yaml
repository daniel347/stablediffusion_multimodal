seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "MM_CelebA_Autoencoder"
print_freq: 50

function:
  name: training_loop
  kwargs: {}

data:
  dataset_name: mm_celeba
  datadir:  ../../datasets/CelebAMask-HQ # ../mmvaeplus/data/CelebAMask-HQ  # ../../datasets/CelebAMask-HQ
  input_size: 128
  modalities: ["colour", "semseg"]
  channels: [3, 18]

  outputdir: ../outputs


training:
  use_mixed_precision: False

  lr: 1e-4  # 3.0e-4
  batch_size: 32
  num_epochs: 10
  patience: 3

  start_epoch: 10
  K: 1

  objective:
    name: non_disentangled_objective
    params:
      wlpips: [ 1000, 0.0 ]
      wadversary: 0
      beta: 1
      channel_weighting: #

  grad_clipper:
    clip_percentile: 95
    clip_update_freq: 10
    keep_history_upto: 5000
    start_clip: 10

  #discriminator:
  #  target: ldm.models.discriminator.MMDiscriminator
  #  params:
  #    disc_params:
  #      - in_size: 128
  #      - in_size: 128
  #discriminator_lr: 1.0e-4

eval:
  inception_path: ./data/pt_inception-2015-12-05-6726825d.pth

model_conf: configs/stable-diffusion/v2-inference-mm-rgb-semseg-non-disentangled-non-seperable.yaml
model_initialisation: "../outputs/MM CelebA Autoencoder (Stable Diffusion)/checkpoints/2025_03_17__15_33_29_single_ae_non_seperable_sd_init/model_9.rar"
init_from_stable_diffusion: False
