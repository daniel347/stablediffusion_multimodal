seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "MM CelebA Stable Diffusion"
print_freq: 50

data:
  dataset_name: mm_celeba
  root_data_dir:  ../../datasets/CelebAMask-HQ  # ../../datasets/CelebAMask-HQ  # ../../datasets/CelebAMask-HQ
  input_size: 128
  modality: ["colour", "semseg"]
  p_hor_flip: 0
  p_color_jitter: 0
  outputdir: ../outputs


training:
  use_mixed_precision: False

  lr: 8.0e-5
  gamma: 0.99
  batch_size: 32
  num_epochs: 10
  start_epoch: 0
  patience: 4
  test_only: False

  precompute_latents: True
  force_recompute: False
  precompute_latents_path: "latents_non_disentangled_shared"
  compute_latent_scale: True

  z_mode: "avg"  # one of ["random", "avg"]

  # grad_clipper:
  #   clip_percentile: 95
  #   clip_update_freq: 10
  #   keep_history_upto: 5000
  #   start_clip: 2

eval:
  inception_path: ./data/pt_inception-2015-12-05-6726825d.pth

model_conf: configs/stable-diffusion/v2-inference-mm-rgb-semseg-non-disentangled-non-seperable.yaml
model_initialisation: "../outputs/MM CelebA Stable Diffusion/checkpoints/2025_03_19__08_56_09_non_distentangled_single_ae/model_4.rar"
init_from_stable_diffusion: False
