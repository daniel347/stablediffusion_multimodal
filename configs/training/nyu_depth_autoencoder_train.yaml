seed: 1
device: "cuda:1"  # ["cuda:0", "cuda:1"]
experiment: "NYU_Depth_Autoencoder"
print_freq: 50

function:
  name: training_loop
  kwargs:

data:
  datadir: ../mmvaeplus/data/nyu_data
  input_size: 256

  outputdir: ../outputs


training:
  objective: dreg
  lr: 3.0e-4
  batch_size: 7
  num_epochs: 5

  beta: 2.5

  start_epoch: 0

  K: 1

  wlpips: 1.0
  wadversary: 0.1
  discriminator:
    target: ldm.models.discriminator.MMDiscriminator
    params:
      disc_params:
        - in_size: 128
        - in_size: 128
  discriminator_lr: 1.0e-4

eval:
  inception_path: ./data/pt_inception-2015-12-05-6726825d.pth

model_conf: configs/stable-diffusion/v2-inference-mm.yaml
model_initialisation: "../trained_models/model_8.rar"
init_from_stable_diffusion: False
