seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "NYU Depth Autoencoder (Stable Diffusion)"
print_freq: 50

data:
  datadir: ../mmvaeplus/data/nyu_data
  input_size: 256

  outputdir: ../outputs


training:
  objective: dreg
  lr: 3.0e-4
  batch_size: 7
  num_epochs: 5

  beta: 2.5

  start_epoch: 1

  K: 1

eval:
  inception_path: ./data/pt_inception-2015-12-05-6726825d.pth

model_conf: configs/stable-diffusion/v2-inference-mm.yaml
model_initialisation: "../trained_models/stable_diff_mmvae_nyu_2024_12_10__16_11_41/model_1.rar"
