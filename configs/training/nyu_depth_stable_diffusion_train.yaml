seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "NYU_Depth_Stable_Diffusion"
print_freq: 50

function:
  name: training_loop
  kwargs: {}

data:
  dataset_name: nyu_depth
  root_data_dir: "/rds/general/user/ds3119/ephemeral/nyuv2_processed" # ../../datasets/nyuv2_processed/
  input_size: 128
  modality: ["colour", "depth"]

  outputdir: ../outputs

training:
  use_mixed_precision: False

  lr: 5.0e-4
  batch_size: 2
  num_epochs: 20   # this will be interpreted as subepochs if test_every_iter is specified
  start_iter: 0
  patience: 10     # this will be interpreted as subepochs if test_every_iter is specified
  test_only: False

  test_every_iter: 300

  precompute_latents: True
  force_recompute: False
  precompute_latents_path: "latents_z_combined"
  compute_latent_scale: True
  latent_scale_per_channel: False

  keep_intermediate_models: True  # With false only the best model and the last model is saved, otherwise all epochs showing improvement are saved.

  z_mode: "z_combiner"  # one of ["random", "avg", "z_combiner" or an integer between 0 and NUM_VAES-1]

  grad_clipper:
    clip_percentile: 95
    clip_update_freq: 10
    keep_history_upto: 5000
    start_clip: 10

  t_sampler:

ema:
  target: ldm.modules.ema.PowerFunctionEMA
  params:
    stds: [0.10]

sampler:
  target: ldm.models.diffusion.ddim.DDIMSampler
  params: {}
  run_params:
    S: 200
    eta: 0.5
    timetravel_schedule: [[801, 851], [601, 651], [401, 451], [201, 251], [1, 51]]

eval:
  inception_path: ./data/pt_inception-2015-12-05-6726825d.pth

model_conf: configs/stable-diffusion/v2-inference-mm.yaml
model_initialisation: # "/home/ds3119/multimodal_generation/trained_models/stable_diffusion_nyu_2025_02_07__11_11_50/model_5.rar"
init_from_stable_diffusion: False
