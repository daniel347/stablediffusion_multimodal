seed: 1
device: "cuda:1"  # ["cuda:0", "cuda:1"]
experiment: "MM CelebA Autoencoder (Stable Diffusion)"
print_freq: 50

data:
  dataset_name: mm_celeba
  datadir: ../mmvaeplus/data/CelebAMask-HQ
  input_size: 128
  modalities: ["colour", "semseg"]

  outputdir: ../outputs


training:
  use_mixed_precision: False
  objective: dreg
  lr: 3.0e-4
  batch_size: 3
  num_epochs: 5

  beta: 2.5

  start_epoch: 0

  K: 1

  wlpips: [0.0, 0.0]
  wadversary: 0

  #discriminator:
  #  target: ldm.models.discriminator.MMDiscriminator
  #  params:
  #    disc_params:
  #      - in_size: 128
  #      - in_size: 128
  #discriminator_lr: 1.0e-4

eval:
  inception_path: ./data/pt_inception-2015-12-05-6726825d.pth

model_conf: configs/stable-diffusion/v2-inference-mm-rgb-semseg.yaml
model_initialisation: # "../trained_models/model_8.rar"
init_from_stable_diffusion: True
