seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "MM_CelebA_Autoencoder"
print_freq: 50

data:
  dataset_name: mm_celeba
  datadir:  ../../datasets/CelebAMask-HQ # ../mmvaeplus/data/CelebAMask-HQ  # ../../datasets/CelebAMask-HQ
  input_size: 128
  modalities: ["colour", "semseg"]

  outputdir: ../outputs


training:
  use_mixed_precision: False
  objective:
    name: disentangling_objective
    params:
      wlpips: [0, 0.0]
      wadversary: 0
      beta: 2.5
      channel_weighting: # semseg_class_freqs.pt
      z_close_weight: 0.0 # 1.0
      off_combination_weight: 0.0
      mmd_zw_weight: 0.0  # 1000.0
      mmd_ww_weight: 0.0  # 1000.0


  lr: 1.0e-4  # 3.0e-4
  batch_size: 32
  num_epochs: 10
  patience: 3

  weight_semseg_classes: #

  start_epoch: 0
  K: 1

  grad_clipper:
          clip_percentile: 95
          clip_update_freq: 10
          keep_history_upto: 5000
          start_clip: 10

  #discriminator:
  #  target: ldm.models.discriminator.MMDiscriminator
  #  params:
  #    disc_params:
  #      - in_size: 128
  #      - in_size: 128
  #discriminator_lr: 1.0e-4

eval:
  inception_path: ./data/pt_inception-2015-12-05-6726825d.pth

model_conf: configs/stable-diffusion/v2-inference-mm-rgb-semseg.yaml
model_initialisation: # "../outputs/MM CelebA Autoencoder (Stable Diffusion)/checkpoints/2025_03_04__12_41_08/model_4.rar"
init_from_stable_diffusion: True
