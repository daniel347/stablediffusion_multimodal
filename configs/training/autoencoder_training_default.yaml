use_mixed_precision: False

lr: 2.0e-4  # 3.0e-4
batch_size: 64
num_epochs: 20
patience: 4

start_iter: 0
K: 1

compute_metrics: False

grad_clipper:
  clip_percentile: 95
  clip_update_freq: 10
  keep_history_upto: 5000
  start_clip: 10

defaults:
  - objective: disentangling_objective
  - optional discriminator: None