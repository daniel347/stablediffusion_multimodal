# @package _global_

seed: 1
device: "cuda:0"  # ["cuda:0", "cuda:1"]
experiment: "MM_CelebA_Autoencoder"
notes: "Training the z combiner on the most recent autoencoder involving MM CelebA dataset with RGB and semantic segmentation inputs."
name: "new_hyp_z_comb_training"
print_freq: 50
outputdir: /rds/general/user/ds3119/ephemeral/outputs

function:
  name: training_loop
  params: {}

dataset_name: mm_celeba

training:
  objective:
    params:
      wlpips: [7000, 0.0]
      wadversary: 10000
      mmd_zw_weight: 3500.0
      mmd_ww_weight: 3000.0

  start_iter: 0
  test_every_iter: 400

  objective_is_z_combiner: True
  lr_decoder: 6e-5  # Smaller rate for decoders in z_combiner_training

model_initialisation: "/rds/general/user/ds3119/ephemeral/outputs/MM_CelebA_Autoencoder/checkpoints/2025_09_07__08_56_12_4_1_split/model_2400.pt"
resume_training: False
init_from_stable_diffusion: False

defaults:
  - data: mm_celeba
  - model: v2-inference-mm-rgb-semseg
  - training: autoencoder_training_default
  - override training/objective: 4way_z_combiner_objective
  - override training/discriminator: mm_joint_discriminator_semseg
  - _self_
