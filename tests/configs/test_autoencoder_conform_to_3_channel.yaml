target: ldm.models.autoencoder.AutoencoderKL  # Depth map
params:
  embed_dim: 4
  monitor: val/rec_loss
  embed_spatial_dim: 32
  conform_to_3_channel: true  # perform deterministic repetition and averaging to
  # convert 1 channel to 3 channels and back, so we can initialise from a pretrained encoder
  ddconfig:
    #attn_type: "vanilla-xformers"
    double_z: true
    z_channels: 4
    w_channels: 2
    resolution: 256
    in_channels: 1
    out_ch: 1
    ch: 128
    ch_mult:
    - 1
    - 2
    - 4
    - 4
    num_res_blocks: 2
    attn_resolutions: []
    dropout: 0.0
    checkpoint: True
  lossconfig:
    target: torch.nn.Identity